# Alternative monolithic gNB; use instead of the separate CU-CP/CU-UP/DU.
cu_cp:
  amf:
    addr: 192.168.56.111            # Remote AMF N2 address.
    port: 31412
    bind_addr: 192.168.56.113       # Local gNB N2 address; no CIDR suffix.
    bind_interface: enp0s8         # Host-only interface toward the Core.
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "20893"
            tai_slice_support_list:
              - sst: 1
                sd: "010203"
  inactivity_timer: 7200            # Sets the UE/PDU Session/DRB inactivity timer to 7200 seconds. Supported: [1 - 7200].

cu_up:
  ngu:
    socket:
      -
        bind_addr: 192.168.56.113   # Local N3 GTP-U address.
        bind_interface: enp0s8     # Host-only interface toward the UPF.
        ext_addr: 192.168.56.113    # N3 address advertised to the Core.

ru_sdr:
  device_driver: zmq                # The RF driver name.
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6,verbose # Optionally pass arguments to the selected RF driver.
  srate: 23.04                      # RF sample rate might need to be adjusted according to selected bandwidth.
  tx_gain: 75                       # Transmit gain of the RF might need to adjusted to the given situation.
  rx_gain: 75                       # Receive gain of the RF might need to adjusted to the given situation.

cell_cfg:
  dl_arfcn: 368500                  # ARFCN of the downlink carrier (center frequency).
  band: 3                           # The NR band.
  channel_bandwidth_MHz: 20         # Bandwith in MHz. Number of PRBs will be automatically derived.
  common_scs: 15                    # Subcarrier spacing in kHz used for data.
  plmn: "20893"                     # PLMN broadcasted by the gNB.
  tac: 1                            # Tracking area code (needs to match the core configuration).
  pci: 1
  pdcch:
    common:
      ss0_index: 0                  # Set search space zero index to match srsUE capabilities
      coreset0_index: 12            # Set search CORESET Zero index to match srsUE capabilities
    dedicated:
      ss2_type: common              # Search Space type, has to be set to common
      dci_format_0_1_and_1_1: false # Set correct DCI format (fallback)
  prach:
    prach_config_index: 1           # Sets PRACH config to match what is expected by srsUE
  pdsch:
    mcs_table: qam64                # Sets PDSCH MCS to 64 QAM
  pusch:
    mcs_table: qam64                # Sets PUSCH MCS to 64 QAM

log:
  filename: /home/ubuntu/srsran/srsRAN_Project/mono_logs/gnb.log            # Path of the log file.
  all_level: warning                  # Set to debug to see detailed ZMQ handshake when 'verbose' is enabled in device_args.

pcap:
  mac_enable: true                 # Set to true to enable MAC-layer PCAPs.
  mac_filename: /home/ubuntu/srsran/srsRAN_Project/mono_pcaps/gnb_mac.pcap   # Path where the MAC PCAP is stored.
  ngap_enable: true                # Set to true to enable NGAP PCAPs.
  ngap_filename: /home/ubuntu/srsran/srsRAN_Project/mono_pcaps/gnb_ngap.pcap # Path where the NGAP PCAP is stored.
