# CU-CP: remote Core over enp0s8; CU-UP and DU run on this VM.

cu_cp:
  request_pdu_session_timeout: 40
  inactivity_timer: 7000
  amf:
    addr: 192.168.56.111            # Remote AMF N2 address.
    port: 31412
    bind_addr: 192.168.56.113       # Local CU-CP N2 address; no CIDR suffix.
    bind_interface: enp0s8         # Host-only interface toward the Core.
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "20893"
            tai_slice_support_list:
              - sst: 1
                sd: "010203"
              - sst: 2
                sd: "112233"
  e1ap:
    bind_addr: 127.0.20.1          # Local E1 listener for CU-UP.
  f1ap:
    bind_addr: 127.0.10.1          # Local F1-C listener for DU.

log:
  filename: logs/cu_cp.log
  all_level: info

pcap:
  ngap_enable: true
  ngap_filename: pcaps/cu_cp_ngap.pcap
  f1ap_enable: true
  f1ap_filename: pcaps/cu_cp_f1ap.pcap
  e1ap_enable: true
  e1ap_filename: pcaps/cu_cp_e1ap.pcap

# Below work for VM env
expert_execution:
  threads:
    main_pool:
      backoff_period: 1000
