# Example config for a DU with ZMQ radio.
f1ap:
  cu_cp_addr: 127.0.10.1
  bind_addr: 127.0.10.2

f1u:
  socket:
    -
      bind_addr: 127.0.10.2

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "20893"
  tac: 1
  pci: 1

  pdcch:
    common:
      ss0_index: 0                  # Set search space zero index to match srsUE capabilities
      coreset0_index: 12            # Set search CORESET Zero index to match srsUE capabilities
    dedicated:
      ss2_type: common              # Search Space type, has to be set to common
      dci_format_0_1_and_1_1: false # Set correct DCI format (fallback)
  prach:
    prach_config_index: 1           # Sets PRACH config to match what is expected by srsUE
  pdsch:
    mcs_table: qam64                # Sets PDSCH MCS to 64 QAM
  pusch:
    mcs_table: qam64                # Sets PUSCH MCS to 64 QAM

log:
  filename: /home/free5gc/srsran/srsRAN_Project/logs/du.log
  all_level: info

pcap:
  mac_enable: true
  mac_filename: /home/free5gc/srsran/srsRAN_Project/pcaps/du_mac.pcap
  f1ap_enable: true
  f1ap_filename: /home/free5gc/srsran/srsRAN_Project/pcaps/du_f1ap.pcap
  f1u_enable: true
  f1u_filename: /home/free5gc/srsran/srsRAN_Project/pcaps/du_f1u.pcap
