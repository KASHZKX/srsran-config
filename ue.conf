
#####################################################################
#                   srsUE configuration file
#####################################################################

[rf]
# Using ZMQ device to connect to the gNB.
# The ports and srate are configured to match your du_zmq.yml.
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6
nof_antennas = 1

device_name = zmq
device_args = tx_port=tcp://127.0.0.1:2001,rx_port=tcp://127.0.0.1:2000,base_srate=23.04e6

# According to your du_zmq.yml, the gNB is on band 3.
# The dl_arfcn is 368500, which corresponds to band 3.
[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106

[rrc]
release = 15
ue_category = 4

[usim]
# USIM configuration from your free5gc-ue.yaml
mode = soft
algo = milenage
imsi = 208930000000001
k    = 8baf473f2f8fd09487cccbd7097c6862
opc  = 8e27b6af0e692e750f32667a3b14605d
imei = 356938035643803

[nas]
# APN from your free5gc-ue.yaml
apn = internet
apn_protocol = ipv4

[slicing]
# Slicing configuration from your free5gc-ue.yaml
enable = true
nssai-sst = 1
nssai-sd = 66051

[gw]
netns = ue1
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false

[log]
all_level = warning
filename = /home/free5gc/srsran-config/logs/ue.log
phy_lib_level = none
all_hex_limit = 32

[pcap]
enable = nas
nas_filename = /home/free5gc/srsRAN_4G/pcap/ue_nas.pcap
