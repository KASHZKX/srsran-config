# CU-UP connects to the UPFs over N3. E1 and F1-U are local to the UE VM.

cu_up:
  e1ap:
    cu_cp_addr: 127.0.20.1
    bind_addr: 127.0.20.2
  ngu:
    socket:
      -
        bind_addr: 192.168.56.113
        bind_interface: enp0s8
        ext_addr: 192.168.56.113
  f1u:
    socket:
      -
        bind_addr: 127.0.10.1

log:
  filename: logs/cu_up.log
  all_level: info

pcap:
  e1ap_enable: true
  e1ap_filename: pcaps/cu_up_e1ap.pcap
  f1u_enable: true
  f1u_filename: pcaps/cu_up_f1u.pcap
  n3_enable: true
  n3_filename: pcaps/cu_up_n3.pcap
