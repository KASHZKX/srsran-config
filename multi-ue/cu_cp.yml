# CU-CP connects to free5GC over N2. E1 and F1-C are local to the UE VM.

cu_cp:
  request_pdu_session_timeout: 20
  inactivity_timer: 7200
  amf:
    addr: 192.168.56.111
    port: 31412
    bind_addr: 192.168.56.113
    bind_interface: enp0s8
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "20893"
            tai_slice_support_list:
              - sst: 1
                sd: "010203"
              - sst: 2
                sd: "112233"
  e1ap:
    bind_addr: 127.0.20.1
  f1ap:
    bind_addr: 127.0.10.1

log:
  filename: logs/cu_cp.log
  all_level: info

pcap:
  ngap_enable: true
  ngap_filename: pcaps/cu_cp_ngap.pcap
  f1ap_enable: true
  f1ap_filename: pcaps/cu_cp_f1ap.pcap
  e1ap_enable: true
  e1ap_filename: pcaps/cu_cp_e1ap.pcap
